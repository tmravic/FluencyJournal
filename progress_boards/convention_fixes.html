<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Convention fixes</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f4ef;
      --ink: #1c1915;
      --muted: #5c564c;
      --card: #fffdf8;
      --line: #e4ddd0;
      --easy: #1f7a4d;
      --medium: #8a5a00;
      --hard: #8f2d2d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161411;
        --ink: #f3efe6;
        --muted: #b7ad9e;
        --card: #221e19;
        --line: #3a342c;
        --easy: #8ddeaf;
        --medium: #e6c27a;
        --hard: #f0a3a3;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      max-width: 46rem;
      padding: 2.5rem 1.25rem 4rem;
      background: var(--bg);
      color: var(--ink);
      font: 1.05rem/1.55 "Iowan Old Style", Palatino, Georgia, serif;
    }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 0.5rem; }
    h2 { font-size: 1.45rem; margin: 2.5rem 0 0.75rem; }
    p { margin: 0.6rem 0; }
    .lede { color: var(--muted); }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      padding: 1rem 1.1rem 0.9rem;
      margin: 0.85rem 0;
    }
    article h3 { margin: 0 0 0.35rem; font-size: 1.12rem; line-height: 1.3; }
    .tag {
      display: inline-block;
      font: 0.72rem/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 700;
      margin-right: 0.4rem;
    }
    .easy { color: var(--easy); }
    .medium { color: var(--medium); }
    .hard { color: var(--hard); }
    code, .path {
      font: 0.86rem/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    ul { margin: 0.4rem 0 0.2rem; padding-left: 1.2rem; }
    li + li { margin-top: 0.35rem; }
  </style>
</head>
<body>
  <h1>Convention fixes</h1>
  <p class="lede">Ordered from the smallest edit to the change that touches the most behavior. Each item says where it lives, what convention it breaks, and the shape of the fix. Sass and BEM sit in this same list. Gem replacements are at the end.</p>

</body>
</html>
