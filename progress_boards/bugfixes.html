<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bugfixes</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f6f4ef;
      --ink: #1c1915;
      --muted: #5c564c;
      --card: #fffdf8;
      --line: #e4ddd0;
      --pass: #1f7a4d;
      --fail: #8f2d2d;
      --check: #8a5a00;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161411;
        --ink: #f3efe6;
        --muted: #b7ad9e;
        --card: #221e19;
        --line: #3a342c;
        --pass: #8ddeaf;
        --fail: #f0a3a3;
        --check: #e6c27a;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0 auto;
      max-width: 46rem;
      padding: 2.5rem 1.25rem 4rem;
      background: var(--bg);
      color: var(--ink);
      font: 1.05rem/1.55 "Iowan Old Style", Palatino, Georgia, serif;
    }
    h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 0.5rem; }
    h2 { font-size: 1.45rem; margin: 2.5rem 0 0.75rem; }
    p { margin: 0.6rem 0; }
    .lede { color: var(--muted); }
    article {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 0.6rem;
      padding: 1rem 1.1rem 0.9rem;
      margin: 0.85rem 0;
    }
    article h3 { margin: 0 0 0.35rem; font-size: 1.12rem; line-height: 1.3; }
    .tag {
      display: inline-block;
      font: 0.72rem/1 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 700;
      margin-right: 0.4rem;
    }
    .fail { color: var(--fail); }
    .pass { color: var(--pass); }
    .check { color: var(--check); }
    code, .path {
      font: 0.86rem/1.45 ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
    }
    ol { margin: 0.5rem 0 0.2rem; padding-left: 0; list-style: none; }
    li { margin: 0.45rem 0; }
    li label {
      display: flex;
      gap: 0.65rem;
      align-items: flex-start;
      cursor: pointer;
    }
    input[type="checkbox"] {
      width: 1.15rem;
      height: 1.15rem;
      margin-top: 0.25rem;
      flex: 0 0 auto;
      accent-color: var(--check);
    }
    .expect {
      margin-top: 0.8rem;
      padding-top: 0.6rem;
      border-top: 1px solid var(--line);
    }
  </style>
</head>
<body>
  <h1>Bugfixes</h1>
  <p class="lede">Nothing is open.</p>

</body>
</html>
