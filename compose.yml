# TODO: Is this setup for production or local development only?
x-app: &default-app
  build:
    context: "."
    dockerfile: Dockerfile.aws
    target: "app"
    args:
      - "RUBY_VERSION=${RUBY_VERSION:-4.0.5}"
      - "RAILS_ENV=${RAILS_ENV:-production}"
  depends_on:
    postgres:
      condition: "service_healthy"
      required: false
  env_file:
    - ".env"
  volumes:
    - "${DOCKER_WEB_VOLUME:-.:/rails}"
    - bundle:/usr/local/bundle
  stdin_open: true
  tty: true

services:
  postgres:
    image: "postgres:latest"
    volumes:
      - "postgres:/var/lib/postgresql/data"
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d ${POSTGRES_DB:-fluency_journal_development}"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles: [ "postgres" ]

  web:
    <<: *default-app
    healthcheck:
      test: "${DOCKER_WEB_HEALTHCHECK_TEST:-curl -f localhost:3000/up}"
      interval: "60s"
      timeout: "3s"
      start_period: "5s"
      retries: 3
    command: [ "sh", "-c", "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0" ]
    ports:
      - "${DOCKER_WEB_PORT_FORWARD:-127.0.0.1:3000}:${PORT:-3000}"
    profiles: ["web"]

  apache:
#    image: httpd:2.4
    image: fluency_journal-apache
    build:
      context: "."
      dockerfile: Dockerfile.apache
    ports:
      - "80:80"
    command: httpd-foreground
    healthcheck:
#      test: ["CMD-SHELL", "curl -f http://localhost/session/new || exit 1"]
      test: ${DOCKER_APACHE_HEALTHCHECK_TEST:-curl -f http://localhost/up}
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    volumes:
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf
    depends_on:
      - web
      - solid_cable

  solid_cable:
    <<: *default-app
    command: ["bundle", "exec", "puma", "-p", "28080", "cable/config.ru"]
    entrypoint: []
    ports:
      - "${DOCKER_CABLE_PORT_FORWARD:-127.0.0.1:28080}:${CABLE_PORT:-28080}"
    profiles: ["solid_cable"]

  solid_queue:
    <<: *default-app
    command: ["bundle", "exec", "rails", "solid_queue:start"]
    entrypoint: []
    profiles: ["solid_queue"]

volumes:
  postgres: {}
  bundle: {}