# .grok/config.toml
#
# Project-specific Grok configuration for Fluency Journal.
# This takes precedence over the global ~/.grok/config.toml.
#
# Goal: Keep Grok from reading the Kamal passwords and secrets file.
# Other files under .kamal/ stay readable. A read deny also covers
# grep and shell commands that open the same path.

[permission]
rules = [
  { action = "deny", tool = "read", pattern = ".kamal/postgres_password" },
  { action = "deny", tool = "read", pattern = ".kamal/registry_password" },
  { action = "deny", tool = "read", pattern = ".kamal/secrets" },

  { action = "deny", tool = "grep", pattern = ".kamal/postgres_password" },
  { action = "deny", tool = "grep", pattern = ".kamal/registry_password" },
  { action = "deny", tool = "grep", pattern = ".kamal/secrets" },
]
