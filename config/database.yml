---

default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  primary:
    <<: *default
    database: fluency_journal_development
  queue:
    <<: *default
    database: fluency_journal_development_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: fluency_journal_development_cable
    migrations_paths: db/cable_migrate

test:
  <<: *default
  database: fluency_journal_test

production:
  primary: &primary_production
    <<: *default
    database: fluency_journal_production
    username: fluency_journal
#    password: <%#= ENV["FLUENCY_JOURNAL_DATABASE_PASSWORD"] %>
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
  cache:
    <<: *primary_production
    database: fluency_journal_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: fluency_journal_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: fluency_journal_production_cable
    migrations_paths: db/cable_migrate

staging:
  primary: &primary_staging
    <<: *default
    database: fluency_journal_staging
    username: fluency_journal
    password: <%= ENV["POSTGRES_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
  cache:
    <<: *primary_staging
    database: fluency_journal_staging_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_staging
    database: fluency_journal_staging_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_staging
    database: fluency_journal_staging_cable
    migrations_paths: db/cable_migrate